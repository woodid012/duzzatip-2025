name: DuzzaTip Backup Trigger

on:
  schedule:
    # Every 20 mins during AFL lockout windows (Thu/Fri/Sat/Sun AEST).
    # These same windows cover the Duzza Finals side comp (rounds 26-29,
    # Sept-Oct) for every week except one: the Grand Final bounces Saturday
    # afternoon with no Friday-night game of its own, so its "early" alert
    # (~24h before lockout) lands Friday AFTERNOON — before the existing
    # Fri 6-9pm window opens. The Fri 11am-6pm line below closes that gap
    # (mirrors the existing Sun 11am-6pm line). Every other finals week
    # (Qualifying/Elimination, Semis, Prelims) already has a Thu- or
    # Fri-evening game of its own, so its early alert already falls inside
    # an existing window.
    - cron: '*/20 8-11 * * 4'   # Thu 6pm-9pm AEST
    - cron: '*/20 1-8 * * 5'    # Fri 11am-6pm AEST (Grand Final early-alert coverage)
    - cron: '*/20 8-11 * * 5'   # Fri 6pm-9pm AEST
    - cron: '*/20 1-11 * * 6'   # Sat 11am-9pm AEST
    - cron: '*/20 1-8 * * 0'    # Sun 11am-6pm AEST
  workflow_dispatch:
    inputs:
      force:
        description: 'Skip the 24h lockout gate (?force=1) and trigger immediately'
        required: false
        default: 'false'
      round:
        description: 'Force a specific round (e.g. 26 for Duzza Finals week 1)'
        required: false
        default: ''

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Manual forced trigger
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true'
        run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.round }}" ]; then EXTRA="&round=${{ github.event.inputs.round }}"; fi
          echo "Forcing DuzzaTip trigger (round='${{ github.event.inputs.round }}')..."
          curl -s -X POST "https://duzzatip.vercel.app/api/lockout-notify?token=${{ secrets.NOTIFY_SECRET }}&force=1$EXTRA"

      - name: Probe teams
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.force != 'true'
        id: probe
        run: |
          RESULT=$(curl -s "https://duzzatip.vercel.app/api/lockout-notify?probe=1&token=${{ secrets.NOTIFY_SECRET }}")
          echo "result=$RESULT" >> $GITHUB_OUTPUT
          echo $RESULT

      - name: Trigger if announced and not locked
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.force != 'true'
        run: |
          ANNOUNCED=$(echo '${{ steps.probe.outputs.result }}' | jq '.announced')
          LOCKED=$(echo '${{ steps.probe.outputs.result }}' | jq '.lockout.locked')
          ROUND=$(echo '${{ steps.probe.outputs.result }}' | jq '.round')
          echo "Round=$ROUND announced=$ANNOUNCED locked=$LOCKED"
          if [ "$ANNOUNCED" = "true" ] && [ "$LOCKED" = "false" ]; then
            echo "Triggering DuzzaTip..."
            curl -s -X POST "https://duzzatip.vercel.app/api/lockout-notify?token=${{ secrets.NOTIFY_SECRET }}"
          else
            echo "Skipping - not announced or already locked"
          fi
